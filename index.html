<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .box1 {
            width: 100%;
            background-color: red;
        }

        .box1>p {
            width: 50%;
            font-size: 2rem;
            background-color: orange;
        }

        .box2 {
            height: 100vh;
            width: 50vw;
            background-color: aqua;
            font-size: 14px;
        }

        .box2>p {
            font-size: 2em;
        }
    </style>
</head>

<body>
    <div class="box1">
        <p>box1</p>
    </div>

    <div class="box2">
        <p>box2</p>
    </div>
</body>

</html>
